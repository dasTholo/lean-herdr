# lean-herdr configuration. Precedence: CLI flag > this file > built-in default.
# Everything here is commented out, so the project behaves exactly as it does
# without this file. Uncomment what you want to change.
#
# [default] applies to every role and also beats the built-in per-role
# defaults (orchestrator = minimal). To change a single role, write it under
# [roles.<role>].

# [default]
# direction = "right"          # right | down -- herdr pane split --direction
# ratio = 0.5                  # 0 < r < 1 -- herdr pane split --ratio
# focus = false                # true: the new pane takes focus
# name_template = "{role}-{branch}"   # both placeholders are mandatory
# profile = "standard"         # minimal 2711 / standard 4920 / power 11559 tokens
# ready_timeout_s = 45.0       # how long to wait for the agent's MCP server

# [roles.orchestrator]
# profile = "minimal"
# kind  = "opencode"   # claude | opencode -- built-in for THIS role only
# model = ""           # empty: no --model on `workspace up` or the keystroke;
#                      # `dispatch orchestrator` still needs --model or this key

# [roles.builder]
# direction = "down"
# kind  = "claude"     # workers have no built-in kind -- say it here or
# model = "sonnet"     # pass --kind/--model on every dispatch

# [roles.reviewer]
# ratio = 0.3
# kind  = "opencode"
# model = ""           # a DIFFERENT model than the builder: different
#                      # blind spots is the whole point of the second pass
# shares_reviewed_model = false  # true: a role it reviews shares its model, meant

# [llm]
# Read by lean_herdr/llm.py alone: the commit generator worktrunk calls
# through lean-herdr llm generate, and the pre-review judge behind --prereview.
# They are two different jobs -- the generator formats a diffstat, the
# judge reads code -- so they get separate keys, and the judge inherits
# only where a line below says so.
#
# The commit generator:
#   model:  --model > $LEAN_HERDR_LLM_MODEL > model
#           > models.auto.toml model > built-in
#   effort: --effort > effort > built-in "minimal"
# model = "google/gemini-3.8-flash"   # the judge falls back to this
# effort = "minimal"                  # THE GENERATOR ONLY -- not the judge
#
# The pre-review judge:
#   model:  --model > $LEAN_HERDR_PREREVIEW_MODEL > prereview_model
#           > $LEAN_HERDR_LLM_MODEL > model > models.auto.toml model
#           > built-in
#   effort: --effort > prereview_effort > built-in
# prereview_model = ""                # empty: share `model` above
# prereview_effort = "low"            # `effort` above is NOT inherited
#
# Raising `model` to make the judge smarter raises the generator's bill
# on every commit; give the judge `prereview_model` instead.
# `effort` and `prereview_effort`: minimal | low | medium | high.
# `models.auto.toml` beside this file is written by `lean-herdr models`
# and loses to every line here. See [models] below.

# [workspace] describes the pane `lean-herdr workspace up` opens for the
# orchestrator. `kind` and `model` moved to [roles.orchestrator].

# [workspace]
# label = "{repo}"     # herdr workspace label; {repo} = directory name, optional

# [models] lets `lean-herdr workspace up` keep [llm].model current from
# OpenRouter's catalogue. It writes .lean-ctx/lean-herdr/models.auto.toml,
# which loses to this file: an explicit [llm].model here survives every
# check. Off by default -- without `auto = true` nothing is fetched and
# nothing is written. `lean-herdr models check | apply` run either way.

# [models]
# auto = false                 # true: `workspace up` may refresh the overlay
# max_age_h = 24.0             # older than this: fetch again
# min_coding_index = 0.0       # benchmarks.artificial_analysis, 0 = no floor
# min_intelligence_index = 0.0 # dito
# max_prompt_price = 0.0       # USD per token. 0.0 is NO LIMIT, not "free only"
# min_context = 0              # context_length, 0 = no floor
# requires = ["reasoning"]     # supported_parameters. `tools` is NOT in here:
#                              # both jobs on [llm].model use zero tools
