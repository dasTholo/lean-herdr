[project]
name = "lean-herdr"
version = "0.1.0"
description = "Orchestrator workspace between Herdr and lean-ctx"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lean-herdr = "lean_herdr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lean_herdr"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# PGH005 takes FakeProc.called_with(...) for a mock assertion. FakeProc is no
# mock, and called_with is a real method defined in tests/doubles.py.
"tests/*.py" = ["PGH005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests run ONLY on explicit request (`-m integration`). Without
# this line a bare `pytest -q` runs them along as soon as the binaries are
# installed -- and `herdr plugin link` then really registers a plugin in the
# user's system. That happened exactly once.
addopts = "-m 'not integration'"
markers = [
    "integration: needs real lean-ctx/herdr/wt binaries or a real wheel build, not in CI",
]
